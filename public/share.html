<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PIXELCAM — Shared Polaroid</title>
  <meta name="description" content="View this retro pixel dot-art polaroid shared via PIXELCAM.">

  <!-- Security Headers (Matches backend CSP directives) -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/share.css">
</head>

<body>

  <div class="container">
    <a href="./index.html" class="brand">
      <h1>PIXELCAM</h1>
    </a>

    <div class="loader" id="loader">DECRYPTING POLAROID...</div>

    <div id="errorBox" class="error-msg" style="display: none;"></div>

    <div class="polaroid-card" id="polaroidCard" style="display: none;">
      <div class="polaroid-photo-frame">
        <canvas id="photoCanvas" width="480" height="480"></canvas>
      </div>
      <div class="polaroid-caption" id="caption"></div>
    </div>

    <div style="display: flex; gap: 14px; margin-top: 10px;">
      <a href="./index.html" class="btn pixel-corners pixel-corners-sm">
        📷 MAKE YOUR OWN
      </a>
      <button class="btn secondary pixel-corners pixel-corners-sm" id="dlBtn" style="display: none;">
        ⭳ DOWNLOAD
      </button>
    </div>
  </div>

  <script type="module" src="./js/share.js"></script>
</body>

</html>
