<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PIXELCAM — Shared Polaroid</title>
  <meta name="description" content="View this retro pixel dot-art polaroid shared via PIXELCAM.">

  <!-- Security Headers (Matches backend CSP directives) -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #F5EFDD;
      --ink: #241B2F;
      --bg-deep: #191221;
      --bg-mid: #2A2138;
      --chrome: #4A3E63;
      --chrome-light: #6C5C8A;
      --pink: #FF6F9C;
      --cyan: #5EEAD4;
      --yellow: #FFD166;
      --step: 10px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    body {
      background:
        radial-gradient(circle at 20% 10%, #2E2440 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, #241C34 0%, transparent 50%),
        var(--bg-deep);
      font-family: 'VT323', monospace;
      color: var(--paper);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .pixel-corners {
      clip-path: polygon(0 var(--step), var(--step) var(--step), var(--step) 0,
          calc(100% - var(--step)) 0, calc(100% - var(--step)) var(--step), 100% var(--step),
          100% calc(100% - var(--step)), calc(100% - var(--step)) calc(100% - var(--step)), calc(100% - var(--step)) 100%,
          var(--step) 100%, var(--step) calc(100% - var(--step)), 0 calc(100% - var(--step)));
    }

    .pixel-corners-sm {
      --step: 6px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .brand {
      text-align: center;
      text-decoration: none;
    }

    .brand h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 24px;
      margin: 0;
      letter-spacing: 2px;
      color: var(--paper);
      text-shadow: 3px 3px 0 var(--pink), 6px 6px 0 var(--ink);
    }

    /* Polaroid Card container */
    .polaroid-card {
      width: 100%;
      max-width: 380px;
      background: var(--paper);
      padding: 16px 16px 48px;
      box-shadow: 12px 12px 0 rgba(0, 0, 0, 0.5);
      border: 4px solid var(--ink);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .polaroid-photo-frame {
      width: 100%;
      aspect-ratio: 1/1;
      background: #0d0912;
      border: 3px solid var(--ink);
      overflow: hidden;
      position: relative;
    }

    #photoCanvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    .polaroid-caption {
      font-family: 'VT323', monospace;
      font-size: 22px;
      color: var(--ink);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 26px;
      line-height: 1.2;
    }

    /* Actions */
    .btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--ink);
      background: var(--cyan);
      border: 3px solid var(--ink);
      padding: 14px 20px;
      text-align: center;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--bg-deep);
      text-decoration: none;
      transition: transform .06s ease, box-shadow .06s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background: #fffaf0;
    }

    .btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 var(--bg-deep);
    }

    .btn.secondary {
      background: var(--pink);
    }

    .loader {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--yellow);
      text-align: center;
    }

    .error-msg {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--pink);
      text-align: center;
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <div class="container">
    <a href="./index.html" class="brand">
      <h1>PIXELCAM</h1>
    </a>

    <div class="loader" id="loader">DECRYPTING POLAROID...</div>

    <div id="errorBox" class="error-msg" style="display: none;"></div>

    <div class="polaroid-card" id="polaroidCard" style="display: none;">
      <div class="polaroid-photo-frame">
        <canvas id="photoCanvas" width="480" height="480"></canvas>
      </div>
      <div class="polaroid-caption" id="caption"></div>
    </div>

    <div style="display: flex; gap: 14px; margin-top: 10px;">
      <a href="./index.html" class="btn pixel-corners pixel-corners-sm">
        📷 MAKE YOUR OWN
      </a>
      <button class="btn secondary pixel-corners pixel-corners-sm" id="dlBtn" style="display: none;">
        ⭳ DOWNLOAD
      </button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const loader = document.getElementById('loader');
      const errorBox = document.getElementById('errorBox');
      const polaroidCard = document.getElementById('polaroidCard');
      const canvas = document.getElementById('photoCanvas');
      const captionEl = document.getElementById('caption');
      const dlBtn = document.getElementById('dlBtn');

      const urlParams = new URLSearchParams(window.location.search);
      const shareId = urlParams.get('id');

      if (!shareId) {
        loader.style.display = 'none';
        errorBox.textContent = 'ERROR: INVALID OR MISSING SHARE ID';
        errorBox.style.display = 'block';
        return;
      }

      try {
        const res = await fetch(`/api/share/${shareId}`);
        if (!res.ok) {
          throw new Error(res.status === 404 ? 'POLAROID NOT FOUND' : 'FAILED TO LOAD ENCRYPTED DATA');
        }

        const data = await res.json();
        const img = new Image();
        img.onload = () => {
          loader.style.display = 'none';
          polaroidCard.style.display = 'flex';
          dlBtn.style.display = 'inline-flex';

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);

          captionEl.textContent = data.caption || '';

          // Setup download handler
          dlBtn.addEventListener('click', () => {
            // Bake frame and caption into export
            const exportCanvas = document.createElement('canvas');
            const pad = 24, photoSize = 480, bottomPad = 96;
            exportCanvas.width = photoSize + pad * 2;
            exportCanvas.height = photoSize + pad + bottomPad;

            const eCtx = exportCanvas.getContext('2d');
            eCtx.fillStyle = '#F5EFDD'; // Standard Polaroid frame color
            eCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

            eCtx.imageSmoothingEnabled = false;
            eCtx.drawImage(canvas, pad, pad, photoSize, photoSize);

            if (data.caption) {
              eCtx.fillStyle = '#241B2F';
              eCtx.font = "32px 'VT323', monospace";
              eCtx.textAlign = 'center';
              eCtx.textBaseline = 'middle';
              eCtx.fillText(data.caption, exportCanvas.width / 2, photoSize + pad + bottomPad / 2, exportCanvas.width - pad * 2);
            }

            exportCanvas.toBlob((blob) => {
              const url = URL.createObjectURL(blob);
              const link = document.createElement('a');
              link.download = `pixelcam-shared-${shareId}.png`;
              link.href = url;
              link.click();
              setTimeout(() => URL.revokeObjectURL(url), 4000);
            }, 'image/png');
          });
        };
        img.onerror = () => {
          throw new Error('FAILED TO LOAD POLAROID IMAGE SOURCE');
        };
        img.src = data.imageDataUrl;
      } catch (err) {
        loader.style.display = 'none';
        errorBox.textContent = `ERROR: ${err.message.toUpperCase()}`;
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>

</html>
